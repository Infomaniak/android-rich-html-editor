name: Publish to Maven Central

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Already released version to also publish to Maven Central (x.x.x). Must match an existing Git tag/GitHub Release.'
        required: true
        type: string
      acknowledgement:
        description: |
          WARNING: Publishing a version to Maven Central is irrevocable.
          Do you confirm (Yes/no):
          1. This version was already published to Reposilite
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Publish artifacts
    runs-on: [ self-hosted, Android ]
    steps:
      - name: Check acknowledgement
        env:
          ACKNOWLEDGEMENT: ${{ github.event.inputs.acknowledgement }}
        run: test "$ACKNOWLEDGEMENT" = "Yes" || (echo "Acknowledgement missing" && exit 1)

      - name: Checkout sources
        uses: actions/checkout@v4.2.2

      - name: Check that the version was already released
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 \
            || (echo "No GitHub Release found for version $VERSION. Publish it via 'Publish to Reposilite' first." && exit 1)

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Publish artifacts
        env:
          LIB_VERSION: ${{ inputs.version }}
        run: ./gradlew publishAggregationToCentralPortal -PlibVersion="$LIB_VERSION"
env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8"
  ossrhUsername: ${{ secrets.SONATYPE_USERNAME }}
  ossrhPassword: ${{ secrets.SONATYPE_PASSWORD }}
  GPG_key_id: ${{ secrets.GPG_KEY_ID }}
  GPG_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
  GPG_private_password: ${{ secrets.GPG_PRIVATE_PASSWORD }}
