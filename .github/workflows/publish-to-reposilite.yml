name: Publish to Reposilite

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (x.x.x). Leave empty to auto-bump from the latest release using "bump"'
        required: false
        type: string
      bump:
        description: 'Version part to bump automatically when "version" is left empty'
        required: true
        default: patch
        type: choice
        options:
          - major
          - minor
          - patch
      acknowledgement:
        description: |
          WARNING: Publishing a version to Reposilite is irrevocable.
          Do you confirm (Yes/no):
          1. You validated publication to snapshots beforehand
        required: true
        type: string

permissions:
  contents: read

jobs:
  resolve-version:
    name: Resolve version
    uses: Infomaniak/.github/.github/workflows/resolve-next-library-version.yml@v2
    with:
      version: ${{ inputs.version }}
      bump: ${{ inputs.bump }}

  build:
    name: Publish artifacts
    needs: resolve-version
    runs-on: [ self-hosted, Android ]
    permissions:
      contents: write
    steps:
      - name: Check acknowledgement
        env:
          ACKNOWLEDGEMENT: ${{ github.event.inputs.acknowledgement }}
        run: test "$ACKNOWLEDGEMENT" = "Yes" || (echo "Acknowledgement missing" && exit 1)

      - name: Checkout sources
        uses: actions/checkout@v4.2.2

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Create Git tag
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          if ! git ls-remote --tags origin "refs/tags/$VERSION" | grep -q .; then
            git tag "$VERSION"
            git push origin "$VERSION"
          fi

      - name: Publish artifacts
        id: publish
        env:
          LIB_VERSION: ${{ needs.resolve-version.outputs.version }}
        run: ./gradlew publishAllPublicationsToReposiliteRepository -PlibVersion="$LIB_VERSION"

      - name: Remove Git tag if publication failed
        if: failure() && steps.publish.outcome == 'failure'
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: git push origin --delete "$VERSION" || true

      - name: Create GitHub Release
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$VERSION" --title "$VERSION" --generate-notes
          fi
env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8"
  reposiliteUsername: ${{ secrets.REPOSILITE_USERNAME }}
  reposilitePassword: ${{ secrets.REPOSILITE_PASSWORD }}
  GPG_key_id: ${{ secrets.GPG_KEY_ID }}
  GPG_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
  GPG_private_password: ${{ secrets.GPG_PRIVATE_PASSWORD }}
